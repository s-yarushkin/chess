name: Test Chess Academy
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run catalog:check
      - run: npm run catalog:import
        env:
          DB_PATH: /tmp/chess-school-catalog.sqlite
