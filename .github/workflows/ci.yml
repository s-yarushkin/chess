name: Test Chess Academy
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run catalog:check
      - run: node --check api/index.js
      - run: node --check src/cloud-learning.js
